<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Clube de Literatura</title>
</head>

<body>

    <header>

        <h1>📧 Contato</h1>

        <p>
            Entre em contato com o Clube de Literatura.
        </p>

    </header>

    <nav>

        <a href="index.html">Início</a> |
        <a href="sobre.html">Personagens</a> |
        <a href="produtos.html">Produtos</a> |
        <a href="serviços.html">Serviços</a> |
        <a href="contato-nos.html">Contato</a> |
        <a href="parceiros.html">Parceiros</a> |
        <a href="portfólio.html">Portfólio</a> |
        <a href="curriculo.html">Currículo</a>

    </nav>

    <main>

        <section>

            <h2>📨 Formulário de contato</h2>

            <form>

                <label for="nome">
                    Nome:
                </label>

                <br>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >

                <br><br>

                <label for="email">
                    E-mail:
                </label>

                <br>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <br><br>

                <label for="assunto">
                    Assunto:
                </label>

                <br>

                <input
                    type="text"
                    id="assunto"
                    name="assunto"
                >

                <br><br>

                <label for="mensagem">
                    Mensagem:
                </label>

                <br>

                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    cols="40"
                ></textarea>

                <br><br>

                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>

        <section>

            <h2>📞 Informações</h2>

            <p>
                E-mail: clubedeliteratura@example.com
            </p>

            <p>
                Atendimento: segunda a sexta-feira.
            </p>

        </section>

    </main>

    <footer>

        <p>🌸 Clube de Literatura</p>

    </footer>

</body>
</html>
